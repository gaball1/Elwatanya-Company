services:
  postgres:
    image: postgres:16-alpine
    container_name: elwataniya-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elwataniya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elwataniya_secret}
      POSTGRES_DB: ${POSTGRES_DB:-elwataniya_erp}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elwataniya} -d ${POSTGRES_DB:-elwataniya_erp}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
