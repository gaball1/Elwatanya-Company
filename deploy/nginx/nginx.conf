# =============================================================================
# El Wataniya ERP - Production TLS reverse proxy (nginx)
#
# Terminates TLS and routes:
#   /            -> frontend (Next.js)  http://frontend:3000
#   /api/v1/*    -> backend  (NestJS)   http://backend:3001
#
# Mounts:
#   deploy/nginx/nginx.conf              -> /etc/nginx/nginx.conf
#   deploy/nginx/certs/                  -> /etc/nginx/certs
#     fullchain.pem, privkey.pem, dhparam.pem (2048) + self-signed ssl-cert.pem
#
# Set envs: DOMAIN, and optionally CORS_ORIGIN to match the public origin.
# =============================================================================

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # ---- basic ---------------------------------------------------------------
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 35m; # backend json limit is 30mb; leave headroom
  server_tokens off;
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';
  access_log /var/log/nginx/access.log main;
  error_log  /var/log/nginx/error.log warn;

  # ---- upstreams -----------------------------------------------------------
  # Hostnames are templated (NGINX_ENVSUBST_FILTER controls substitution so
  # nginx runtime vars like $host/$scheme are never clobbered).
  upstream frontend_upstream {
    server ${FRONTEND_UPSTREAM};
    keepalive 32;
  }
  upstream backend_upstream {
    server ${BACKEND_UPSTREAM};
    keepalive 32;
  }

  # ---- map: pass the browser scheme so the app can build secure URLs ---------
  map $http_x_forwarded_proto $proxied_scheme {
    default $scheme;
    https   https;
  }

  # ---- rate limit to blunt brute-force / scraping ----------------------------
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;

  # ---- HTTP -> HTTPS redirect -------------------------------------------------
  server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN} _;

    # Let's Encrypt http-01 challenge (certbot)
    location ^~ /.well-known/acme-challenge/ {
      root /var/www/certbot;
      default_type "text/plain";
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  # ---- HTTPS server -----------------------------------------------------------
  server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ${DOMAIN} _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_dhparam         /etc/nginx/certs/dhparam.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- security headers -----------------------------------------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ---- API (backend) ----------------------------------------------------------
    location /api/v1/ {
      limit_req zone=api_limit burst=50 nodelay;

      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_connect_timeout 30s;
      proxy_read_timeout 90s;
      proxy_send_timeout 90s;
      proxy_buffering off;
    }

    # Auth endpoints get a tighter rate limit
    location ~ ^/api/v1/auth/(login|refresh)$ {
      limit_req zone=auth_limit burst=10 nodelay;

      proxy_pass http://backend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_connect_timeout 30s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
      proxy_buffering off;
    }

    # ---- frontend (Next.js) ----------------------------------------------------
    location / {
      proxy_pass http://frontend_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_connect_timeout 30s;
      proxy_read_timeout 60s;
      proxy_send_timeout 60s;
    }

    # gzip for the Next.js HTML/JS payloads
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;
  }
}
