# =============================================================================
# El Wataniya ERP - Production CI gate
#
# Runs on every push (non-draft) and pull request targeting main/production.
# Gates:
#   1. Prisma schema validation
#   2. Backend build (NestJS + TypeScript)
#   3. Backend unit tests (vitest)
#   4. Backend lint (eslint, no autofix)
#   5. Frontend typecheck (tsc --noEmit)
#   6. Frontend build (Next.js)
#   7. Security: npm audit (production deps) + gitleaks secret scan
# =============================================================================
name: CI

on:
  push:
    branches: [main, production, staging]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches: [main, production, staging]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: "1"
  DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
  JWT_SECRET: "ci-test-secret"
  JWT_REFRESH_SECRET: "ci-test-refresh-secret"

jobs:
  # --- Security gates first (fast feedback, fail early) ----------------------
  security:
    name: Security (deps + secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace deps
        run: npm ci --include-workspace-root --no-audit --no-fund

      - name: npm audit (production dependencies only)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true # informational gate; do not hard-block on advisory DB lag

  # --- Backend ---------------------------------------------------------------
  backend:
    name: Backend (validate · build · test · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace deps
        run: npm ci --include-workspace-root --no-audit --no-fund

      - name: Prisma generate
        working-directory: backend
        run: npx prisma generate

      - name: Prisma validate
        working-directory: backend
        run: npx prisma validate

      - name: Backend build
        working-directory: backend
        run: npm run build

      - name: Backend tests
        working-directory: backend
        run: npm test

      - name: Backend lint
        working-directory: backend
        run: npm run lint:ci

  # --- Frontend --------------------------------------------------------------
  frontend:
    name: Frontend (typecheck · build · lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install workspace deps
        run: npm ci --include-workspace-root --no-audit --no-fund

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

  # --- Result badge / status -------------------------------------------------
  status:
    name: CI result
    if: always()
    needs: [security, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check all gates
        run: |
          if [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ]; then
            echo "::error::CI gate failed (security=${{ needs.security.result }}, backend=${{ needs.backend.result }}, frontend=${{ needs.frontend.result }})"
            exit 1
          fi
          echo "All CI gates passed."
